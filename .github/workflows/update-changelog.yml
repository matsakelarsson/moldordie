name: Update Changelog

on:
  # Manual trigger only. A run releases everything merged since the previous
  # release, so adding a schedule here is safe whenever the fork wants that.
  workflow_dispatch:

jobs:
  update:
    # Disables this workflow from running in a repository that is not part of the indicated organization/user
    if: github.repository_owner == 'matsakelarsson'

    runs-on: ubuntu-latest
    # The repository's default token is read-only; a release pushes a commit and a
    # tag to main and publishes a GitHub release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set git details
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
      - name: Update changelog
        run: uv run --locked scripts/update_changelog.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
