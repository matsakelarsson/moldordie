name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macOS-latest
        python-version: ["3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"

    name: "pytest ${{ matrix.os }} py${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest -n auto tests

  docker:
    strategy:
      fail-fast: false
      matrix:
        script:
          - name: Basic
            args: "ci_tool=Gitlab"
          - name: Celery & DRF
            args: "use_celery=y rest_api=DRF"
          - name: Channels
            args: "realtime=channels"

    name: "Docker ${{ matrix.script.name }}"
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked
      - name: Docker ${{ matrix.script.name }}
        run: sh tests/test_docker.sh ${{ matrix.script.args }}

  bare:
    strategy:
      fail-fast: false
      matrix:
        script:
          - name: Celery
            args: "use_celery=y"
          - name: Heroku
            args: "use_heroku=y"
          - name: Email Username
            args: "username_type=email ci_tool=Github project_name='Something superduper long - the great amazing project' project_slug=my_awesome_project"
          - name: Email username & DRF
            args: "username_type=email rest_api=DRF ci_tool=Gitlab"
          - name: Channels & Django-Ninja
            args: "realtime=channels rest_api='Django Ninja'"
          - name: Channels, email username & Django-Ninja
            args: "realtime=channels username_type=email rest_api='Django Ninja'"
          - name: Python 3.12
            args: ""
            python: "3.12"
          - name: Python 3.13 & Channels
            args: "realtime=channels"
            python: "3.13"

    name: "Bare metal ${{ matrix.script.name }}"
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
      postgres:
        image: postgres:14
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres

    env:
      REDIS_URL: "redis://localhost:6379/0"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_HOST: "localhost"
      POSTGRES_DB: "postgres"

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked
      - name: Bare Metal ${{ matrix.script.name }}
        run: sh tests/test_bare.sh ${{ matrix.script.args }}
        env:
          PYTHON_VERSION: ${{ matrix.script.python || '3.14' }}

  smoke-win:
    strategy:
      fail-fast: false
      matrix:
        script:
          - name: Windows
            args: "windows=y"
    name: "Windows Smoke Test ${{ matrix.script.name }}"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked
      - name: Bare Metal ${{ matrix.script.name }}
        run: ./tests/test_generate.ps1
        shell: pwsh
        env:
          COOKIECUTTER_ARGS: ${{ matrix.script.args }}
