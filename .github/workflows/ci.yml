name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
        python-version: ["3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"

    name: "pytest ${{ matrix.os }} py${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest -n auto tests

  # The style checks on the generated projects that a formatter would fix. They are skipped
  # without AUTOFIXABLE_STYLES and take longer than the rest of the suite, and the generated
  # output is the same on every Python version, so they run once, on their own.
  auto-fixable:
    name: "pytest auto-fixable styles"
    runs-on: ubuntu-latest
    env:
      AUTOFIXABLE_STYLES: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --locked
      - name: Check the formatting of the generated projects
        run: uv run pytest -n auto tests -m auto_fixable

  docker:
    strategy:
      fail-fast: false
      matrix:
        script:
          - name: Basic
            args: "ci_tool=Gitlab"
          - name: Entra & Prometheus without Django Ninja
            args: "ci_tool=Gitlab observability=prometheus identity_provider=entra"
          - name: Celery, DRF & OpenTelemetry
            args: "use_celery=y rest_api=DRF observability=opentelemetry"
          # The Sentry app without Celery's integration; the bare-metal job has the other arm
          - name: Channels & Sentry
            args: "realtime=channels use_sentry=y"
          # No cloud provider, so nginx serves the media: the only row that builds its image
          - name: Entra, Django-Ninja & nginx
            args: "identity_provider=entra rest_api='Django Ninja' cloud_provider=None use_whitenoise=y"

    name: "Docker ${{ matrix.script.name }}"
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked
      - name: Docker ${{ matrix.script.name }}
        run: sh tests/test_docker.sh ${{ matrix.script.args }}

  bare:
    strategy:
      fail-fast: false
      matrix:
        script:
          - name: Celery
            args: "use_celery=y"
          - name: Celery, OpenTelemetry & Sentry
            args: "use_celery=y observability=opentelemetry use_sentry=y"
          - name: Email Username
            args: "username_type=email ci_tool=Github project_name='Something superduper long - the great amazing project' project_slug=my_awesome_project"
          - name: Email username & DRF
            args: "username_type=email rest_api=DRF ci_tool=Gitlab"
          - name: Channels & Django-Ninja
            args: "realtime=channels rest_api='Django Ninja'"
          - name: Channels, email username & Django-Ninja
            args: "realtime=channels username_type=email rest_api='Django Ninja'"
          - name: Google & Django-Ninja
            args: "identity_provider=google rest_api='Django Ninja'"
          - name: Python 3.12 & WhiteNoise
            args: "use_whitenoise=y"
            python: "3.12"
          - name: Python 3.13 & Channels
            args: "realtime=channels"
            python: "3.13"

    name: "Bare metal ${{ matrix.script.name }}"
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
      postgres:
        image: postgres:18
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres

    env:
      REDIS_URL: "redis://localhost:6379/0"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_HOST: "localhost"
      POSTGRES_DB: "postgres"

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked
      - name: Bare Metal ${{ matrix.script.name }}
        run: sh tests/test_bare.sh ${{ matrix.script.args }}
        env:
          PYTHON_VERSION: ${{ matrix.script.python || '3.14' }}
