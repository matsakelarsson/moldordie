{% raw %}<c-ui.card id="report">
  <c-slot name="header">
    <h3>Monthly report</h3>
    <p>Updated this morning</p>
  </c-slot>
  <p>The content is the card's body; the header and the actions are optional slots.</p>
  <c-slot name="actions">
    <c-ui.button>
      Open
    </c-ui.button>
    <c-ui.button variant="secondary">
      Share
    </c-ui.button>
  </c-slot>
</c-ui.card>
<c-ui.card>
  <p>A card with a body only.</p>
</c-ui.card>
{%- endraw %}
