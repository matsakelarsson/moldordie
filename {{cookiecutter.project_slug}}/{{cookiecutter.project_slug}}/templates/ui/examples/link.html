{% raw %}<p>
  A plain link keeps its underline, like
  <c-ui.link href="{% url 'about' %}">
    the about page
  </c-ui.link>
  in running text.
</p>
<div class="ui-actions">
  <c-ui.link href="{% url 'home' %}" appearance="button">
    Primary
  </c-ui.link>
  <c-ui.link href="{% url 'home' %}" appearance="button" variant="secondary">
    Secondary
  </c-ui.link>
  <c-ui.link href="{% url 'home' %}"
             appearance="button"
             variant="quiet"
             size="small">
    Quiet and small
  </c-ui.link>
</div>
{%- endraw %}
