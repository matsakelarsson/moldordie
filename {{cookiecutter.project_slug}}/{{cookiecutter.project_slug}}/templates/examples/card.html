{% raw %}<div class="grid gap-4 md:grid-cols-2">
  <article class="card card-border bg-base-100">
    <div class="card-body">
      <h3 class="card-title">A card</h3>
      <p>Its body is a column: a title, what it says, and its actions at the end.</p>
      <div class="card-actions justify-end">
        <button class="btn btn-ghost" type="button">Later</button>
        <button class="btn btn-primary" type="button">Open</button>
      </div>
    </div>
  </article>
  <article class="card bg-primary text-primary-content">
    <div class="card-body">
      <h3 class="card-title">In the primary colour</h3>
      <p>A colour and the colour of what is written on it come as a pair from the theme.</p>
      <div class="stats bg-base-100 text-base-content">
        <div class="stat">
          <div class="stat-title">Themes</div>
          <div class="stat-value">36</div>
          <div class="stat-desc">one of them yours</div>
        </div>
      </div>
    </div>
  </article>
</div>
{%- endraw %}
