{% raw %}{% extends "base.html" %}

{% block title %}Forbidden (403){% endblock title %}
{% block content %}
  <c-ui.card>
    <c-slot name="header">
      <h1>Forbidden (403)</h1>
    </c-slot>
    <p>
      {% if exception %}
        {{ exception }}
      {% else %}
        You're not allowed to access this page.
      {% endif %}
    </p>
  </c-ui.card>
{% endblock content %}
{%- endraw %}
