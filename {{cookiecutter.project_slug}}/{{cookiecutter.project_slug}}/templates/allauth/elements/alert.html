{% raw %}{% load allauth %}

{# allauth's alert element: a notice that is in the page from the start, so it carries no role and is not announced #}
<div class="alert {% if attrs.level == 'success' %}alert-success{% elif attrs.level == 'warning' %}alert-warning{% elif attrs.level == 'error' or attrs.level == 'danger' %}alert-error{% else %}alert-info{% endif %}">
  <span>
    {% slot message %}
    {% endslot %}
  </span>
</div>
{%- endraw %}
