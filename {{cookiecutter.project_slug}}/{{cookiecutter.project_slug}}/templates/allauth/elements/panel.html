{% raw %}{% load allauth %}

{# allauth's panel element: a card whose title is a second-level heading #}
<c-ui.card>
  <c-slot name="header">
    <h2>
      {% slot title %}
      {% endslot %}
    </h2>
  </c-slot>
  {% slot body %}
  {% endslot %}
  {% if slots.actions %}
    <c-slot name="actions">
      {% for action in slots.actions %}{{ action }}{% endfor %}
    </c-slot>
  {% endif %}
</c-ui.card>
{%- endraw %}
