{% raw %}{% load allauth %}

{# allauth's form element: its fields in a column, its actions in a row beneath them #}
<form class="flex flex-col gap-4"
      method="{{ attrs.method }}"
      {% if attrs.action %}action="{{ attrs.action }}"{% endif %}>
  {% slot body %}
  {% endslot %}
  <div class="flex flex-wrap items-center gap-2">
    {% slot actions %}
    {% endslot %}
  </div>
</form>
{%- endraw %}
