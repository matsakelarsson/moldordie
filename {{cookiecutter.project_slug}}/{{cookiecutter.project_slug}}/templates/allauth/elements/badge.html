{% raw %}{% load allauth %}

{# allauth's badge element; its tags choose the level: success, warning, danger (error), primary (info) #}
<c-ui.badge level="{% if 'success' in attrs.tags %}success{% elif 'warning' in attrs.tags %}warning{% elif 'danger' in attrs.tags %}error{% elif 'primary' in attrs.tags %}info{% else %}neutral{% endif %}"
            :title="attrs.title">
  {% slot %}
  {% endslot %}
</c-ui.badge>
{%- endraw %}
