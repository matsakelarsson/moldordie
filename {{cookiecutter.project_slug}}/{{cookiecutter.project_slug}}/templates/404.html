{% raw %}{% extends "base.html" %}

{% block title %}Page not found{% endblock title %}
{% block content %}
  <c-ui.card>
    <c-slot name="header">
      <h1>Page not found</h1>
    </c-slot>
    <p>
      {% if exception %}
        {{ exception }}
      {% else %}
        This is not the page you were looking for.
      {% endif %}
    </p>
  </c-ui.card>
{% endblock content %}
{%- endraw %}
