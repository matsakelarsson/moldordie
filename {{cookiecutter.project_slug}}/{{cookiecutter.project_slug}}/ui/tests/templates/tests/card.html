{% raw %}<c-ui.card id="full">
  <c-slot name="header">
    <h2>Title</h2>
  </c-slot>
  Body
  <c-slot name="actions">
    <c-ui.button>
      Act
    </c-ui.button>
  </c-slot>
</c-ui.card>
<c-ui.card class="plain">
  Only body
</c-ui.card>
<c-ui.card id="conditional">
  {% if show_actions %}
    <c-slot name="actions">
      Yes
    </c-slot>
  {% endif %}
  Body
</c-ui.card>
{%- endraw %}
