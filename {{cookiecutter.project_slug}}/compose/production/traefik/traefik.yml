log:
  level: INFO

entryPoints:
  web:
    # http
    address: ':80'
    http:
      # https://doc.traefik.io/traefik/routing/entrypoints/#entrypoint
      redirections:
        entryPoint:
          to: web-secure

  web-secure:
    # https
    address: ':443'
  {%- if cookiecutter.use_celery == 'y' %}

  flower:
    address: ':5555'
  {%- endif %}

certificatesResolvers:
  letsencrypt:
    # https://doc.traefik.io/traefik/https/acme/#lets-encrypt
    acme:
      email: "{{ cookiecutter.email | string_escape }}"
      storage: /etc/traefik/acme/acme.json
      # https://doc.traefik.io/traefik/https/acme/#httpchallenge
      httpChallenge:
        entryPoint: web

providers:
  # https://doc.traefik.io/traefik/master/providers/file/
  # The dynamic configuration, which Traefik recommends keeping out of this file: the
  # services and middlewares every deployed environment shares, and the routers of the
  # environment this image was built for, which name that environment's own hosts.
  file:
    directory: /etc/traefik/dynamic
    watch: true
