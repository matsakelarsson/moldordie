[project]
name = "{{ cookiecutter.project_slug }}"
version = "{{ cookiecutter.version | string_escape }}"
description = "{{ cookiecutter.description | string_escape }}"
readme = "README.md"
license = { text = "{{ cookiecutter.open_source_license }}" }
authors = [
  { name = "{{ cookiecutter.author_name | string_escape }}", email = "{{ cookiecutter.email | string_escape }}" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi==25.1.0",
{%- if cookiecutter.use_celery == 'y' %}
  "celery==5.6.3",
{%- endif %}
{%- if cookiecutter.realtime == 'channels' %}
  "channels==4.3.2",
  "channels-redis==4.3.0",
{%- endif %}
{%- if cookiecutter.use_whitenoise == 'n' and cookiecutter.cloud_provider == 'AWS' %}
  "collectfasta==3.3.4",
{%- endif %}
  "django==6.0.8",
  "django-allauth[mfa]==65.19.2",
{%- if cookiecutter.mail_service == 'Other SMTP' %}
  "django-anymail==15.2",
{%- elif cookiecutter.mail_service == 'Amazon SES' %}
  "django-anymail[amazon-ses]==15.2",
{%- elif cookiecutter.mail_service == 'Mailgun' %}
  "django-anymail[mailgun]==15.2",
{%- endif %}
{%- if cookiecutter.use_celery == 'y' %}
  "django-celery-beat==2.9.0",
{%- endif %}
{%- if cookiecutter.rest_api in ('DRF', 'Django Ninja') %}
  "django-cors-headers==4.9.0",
{%- endif %}
  "django-environ==0.14.0",
  "django-htmx==1.29.0",
{%- if cookiecutter.rest_api == 'Django Ninja' %}
  "django-ninja==1.7.0",
{%- endif %}
  "django-redis==7.0.0",
{%- if cookiecutter.cloud_provider == 'AWS' %}
  "django-storages[s3]==1.14.6",
{%- endif %}
  "django-stubs-ext==6.1.0",
  "django-tasks-db==0.13.0",
{%- if cookiecutter.rest_api == 'DRF' %}
  "djangorestframework==3.18.1",
  "drf-spectacular==0.30.0",
{%- endif %}
{%- if cookiecutter.use_celery == 'y' and cookiecutter.use_docker == 'y' %}
  "flower==2.1.0",
{%- endif %}
  "gunicorn==26.2.0",
  "hiredis==3.4.1",
  "psycopg[c]==3.3.5",
  "redis==8.1.0",
{%- if cookiecutter.use_sentry == 'y' %}
  "sentry-sdk==2.69.0",
{%- endif %}
  "uvicorn[standard]==0.52.4",
  "uvicorn-worker==0.4.0",
{%- if cookiecutter.use_whitenoise == 'y' %}
  "whitenoise==6.12.0",
{%- endif %}
]

[dependency-groups]
dev = [
{%- if cookiecutter.use_celery == 'y' %}
  "celery-types==0.26.0",
{%- endif %}
  "coverage==7.16.0",
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==8.0.0",
  "django-extensions==4.1",
  "django-stubs[compatible-mypy]==6.1.0",
  "django-upgrade==1.32.0",
{%- if cookiecutter.rest_api == 'DRF' %}
  "djangorestframework-stubs==3.18.1",
{%- endif %}
  "djlint==1.46.1",
  "factory-boy==3.3.3",
  "ipdb==0.13.13",
  "mypy==2.3.1",
  "pre-commit==4.6.2",
{%- if cookiecutter.use_docker == 'y' %}
  "psycopg[c]==3.3.5",
{%- else %}
  "psycopg[binary]==3.3.5",
{%- endif %}
  "pytest==9.1.1",
  "pytest-django==4.14.0",
  "pytest-sugar==1.1.1",
  "ruff==0.16.6",
  "sphinx==9.1.0",
  "sphinx-autobuild==2025.8.25",
{%- if cookiecutter.realtime == 'channels' %}
  "types-channels==4.3.0.20260518",
{%- endif %}
{%- if cookiecutter.use_celery == 'y' %}
  "watchfiles==1.2.0",
{%- endif %}
  "werkzeug[watchdog]==3.1.8",
]

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
custom_blocks = "element,slot,partialdef"
close_void_tags = true
format_css = true
format_js = true
ignore = "H006,H030,H031"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"
css.indent_size = 2
js.indent_size = 2

# ==== ruff ====
[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]

lint.select = [
  "A",
  "ANN",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "ANN401", # Any is the honest annotation for pass-through *args/**kwargs
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
]
lint.per-file-ignores."**/conftest.py" = [ "ANN" ]
lint.per-file-ignores."**/tests/**" = [ "ANN" ]
lint.isort.force-single-line = true
{%- if cookiecutter.rest_api == 'Django Ninja' %}
# django-ninja evaluates view annotations at import time to build the OpenAPI
# schema, so imports used only in those annotations must stay at runtime.
lint.flake8-type-checking.runtime-evaluated-decorators = [
  "ninja.NinjaAPI.api_operation",
  "ninja.NinjaAPI.delete",
  "ninja.NinjaAPI.get",
  "ninja.NinjaAPI.patch",
  "ninja.NinjaAPI.post",
  "ninja.NinjaAPI.put",
  "ninja.Router.api_operation",
  "ninja.Router.delete",
  "ninja.Router.get",
  "ninja.Router.patch",
  "ninja.Router.post",
  "ninja.Router.put",
]
{%- endif %}

# ==== pyproject-fmt ====
[tool.pyproject-fmt]
keep_full_version = true

# ==== pytest ====
[tool.pytest]
addopts = [
  "--ds=config.settings.test",
  "--reuse-db",
  "--import-mode=importlib",
]
minversion = "9.0"
python_files = [
  "tests.py",
  "test_*.py",
]

# ==== Coverage ====
[tool.coverage.run]
include = [ "{{cookiecutter.project_slug}}/**" ]
omit = [ "*/migrations/*", "*/tests/*" ]
plugins = [ "django_coverage_plugin" ]

# ==== mypy ====
[tool.mypy]
# Check against the oldest supported interpreter so newer stdlib APIs are caught early
python_version = "3.12"
# Strict mode: every function is annotated and every call is checked.
strict = true
warn_unreachable = true
# django-allauth ships no type information, so its adapters are subclassed
# from ``Any``. Keep that permitted.
disallow_subclassing_any = false
enable_error_code = [
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
]
plugins = [
  "mypy_django_plugin.main",
  {%- if cookiecutter.rest_api == 'DRF' %}
  "mypy_drf_plugin.main",
  {%- endif %}
]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
# Test bodies are still checked, but signatures may stay unannotated:
module = [ "*.tests.*", "tests.*", "*.conftest", "conftest" ]
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# factory-boy re-exports its API from the package root without ``__all__``:
module = "factory.*"
implicit_reexport = true

[[tool.mypy.overrides]]
# Third-party packages that ship neither stubs nor a ``py.typed`` marker.
# Add a dependency here only after checking that no stubs package exists for it.
module = [
  "allauth.*",
  {%- if cookiecutter.use_celery == 'y' %}
  "django_celery_beat.*",
  {%- endif %}
  "environ.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
